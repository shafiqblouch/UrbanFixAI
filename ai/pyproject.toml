[project]
name = "urbanfix-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "httpx>=0.27",
    "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp-proto-http>=1.27", "opentelemetry-instrumentation-fastapi>=0.48b0",
    "sentry-sdk>=2.0", "pillow>=10", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["**/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py311"
