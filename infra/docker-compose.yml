name: urbanfix

services:
  postgres:
    # PostgreSQL 16 + PostGIS + pgvector (see postgres.Dockerfile)
    build:
      context: .
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_USER: urbanfix
      POSTGRES_PASSWORD: urbanfix
      POSTGRES_DB: urbanfix
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanfix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: urbanfix
      MINIO_ROOT_PASSWORD: urbanfix-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 urbanfix urbanfix-dev-secret &&
      mc mb --ignore-existing local/urbanfix-media && mc anonymous set none local/urbanfix-media"

volumes:
  pgdata:
  miniodata:
