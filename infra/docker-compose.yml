name: urbanfix

services:
  postgres:
    # PostgreSQL 16 + PostGIS + pgvector (see postgres.Dockerfile)
    build:
      context: .
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_USER: urbanfix
      POSTGRES_PASSWORD: urbanfix
      POSTGRES_DB: urbanfix
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanfix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    # Docker Hub's minio/minio is gone; bitnamilegacy is a frozen, dev-only S3-compatible stand-in.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: urbanfix
      MINIO_ROOT_PASSWORD: urbanfix-dev-secret
      MINIO_DEFAULT_BUCKETS: urbanfix-media
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  jaeger:
    # Local trace viewer: UI http://localhost:16686, OTLP gRPC :4317, OTLP HTTP :4318. CORE and AI both export here.
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317", "4318:4318"]
volumes:
  pgdata:
  miniodata:
