# UrbanFix — whole stack on one Linux server (portal + core API + AI API + Postgres + storage).
# Run from this folder on the server:  docker compose up -d --build
# All settings come from .env (see .env.example). First build takes a while (it compiles the .NET API and the portal).
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: urbanfix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: urbanfix
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanfix"]
      interval: 5s
      retries: 20

  minio:
    # S3-compatible object store for complaint photos and audio.
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: urbanfix-media
    volumes: [miniodata:/bitnami/minio/data]

  ai:
    # FastAPI service (triage, vision, speech). Stateless; talks to OpenRouter.
    build: ../../ai
    restart: unless-stopped
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

  openwa:
    # Dev/demo WhatsApp gateway (OpenWA) that delivers resident OTP codes over WhatsApp instead of SMS.
    # Prebuilt image is used (not built here): this environment and the Dockerfile's apt step need plain
    # HTTP to the Debian mirrors, which is blocked. The port is NOT published — only `core` reaches it on
    # the compose network at http://openwa:2785. Link a WhatsApp number via its dashboard before enabling.
    image: ghcr.io/rmyndharis/openwa:latest
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "2785"
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      AUTO_START_SESSIONS: "true"
      DATABASE_TYPE: sqlite
      DATABASE_SYNCHRONIZE: "true"
      PUPPETEER_HEADLESS: "true"
      PUPPETEER_ARGS: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      # Let the gateway deliver complaint webhooks to `core` on the compose network. OpenWA's SSRF guard blocks
      # private addresses by default ("Destination address is not allowed"); this allowlists just our API host, so
      # webhook delivery stays internal (no Cloudflare, no public exposure). See docs/openwa-complaints.md.
      SSRF_ALLOWED_HOSTS: core
      # WhatsApp photos/voice notes arrive inline as base64; the default 1 MB cap would drop most photos, so raise it.
      WEBHOOK_MEDIA_INLINE_MAX_BYTES: "16777216"
      WEBHOOK_MAX_PAYLOAD_BYTES: "16777216"
      # Modern WhatsApp often delivers the sender as a privacy "LID" (e.g. 56388776677441) instead of a phone number.
      # Resolve it to the real number and include contact details, so the webhook carries senderPhone — without it the
      # system can't match the sender to a resident or send a reply back ("could not resolve recipient").
      RESOLVE_LID_TO_PHONE: "true"
      WEBHOOK_CONTACT_DETAILS: "true"
    volumes: [openwadata:/app/data]
    mem_limit: 2g

  core:
    # .NET 9 API. Runs the DB migration on startup and creates the admin account.
    # Built from the repo root so the sibling contracts/ folder is in the build context.
    build:
      context: ../..
      dockerfile: deploy/server/core.Dockerfile
      args:
        SIXLABORS_LICENSE_KEY: ${SIXLABORS_LICENSE_KEY:-}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PORT: "8080"
      # Development enables the demo sign-in (phone/email code 123456). Switch to Production for real auth
      # (requires an SMS/TOTP provider) — see README.
      ASPNETCORE_ENVIRONMENT: ${CORE_ENVIRONMENT:-Development}
      ConnectionStrings__Owner: Host=postgres;Port=5432;Database=urbanfix;Username=urbanfix;Password=${DB_PASSWORD}
      ConnectionStrings__App: Host=postgres;Port=5432;Database=urbanfix;Username=urbanfix_app;Password=${APP_ROLE_PASSWORD}
      Database__AppRolePassword: ${APP_ROLE_PASSWORD}
      Database__MigrateOnStartup: "true"
      Bootstrap__PlatformAdminEmail: ${ADMIN_EMAIL:-admin@urbanfix.local}
      Bootstrap__PlatformAdminPassword: ${ADMIN_PASSWORD}
      Ai__BaseUrl: http://ai:8000
      Ai__ServiceToken: ${AI_SERVICE_TOKEN}
      Storage__ServiceUrl: http://minio:9000
      # Phones and the portal fetch photos/audio through signed links, so these must use the public address.
      # Media rides the SAME origin as the portal/API (Caddy routes /urbanfix-media/* to MinIO) — no extra host or port.
      Storage__PublicUrl: https://${PUBLIC_HOST}
      Storage__AccessKey: ${STORAGE_ACCESS_KEY}
      Storage__SecretKey: ${STORAGE_SECRET_KEY}
      Storage__Bucket: urbanfix-media
      DataProtection__KeyPath: /keys
      # Deliver resident OTP codes over WhatsApp via the openwa service. Off until a WhatsApp number is
      # linked and OPENWA_API_KEY/OPENWA_SESSION_ID are set in .env (then OPENWA_ENABLED=true + recreate core).
      # Leaving it off keeps the existing behaviour: with Otp:FixedCode set the demo code 123456 still works.
      OpenWa__Enabled: ${OPENWA_ENABLED:-false}
      OpenWa__BaseUrl: http://openwa:2785
      OpenWa__ApiKey: ${OPENWA_API_KEY:-}
      OpenWa__SessionId: ${OPENWA_SESSION_ID:-}
      # Register complaints from WhatsApp: residents message the number, each message becomes a complaint and gets a
      # reply with its reference (see docs/openwa-complaints.md). Needs OPENWA_INBOUND=true, a signing secret shared with
      # the gateway, and the society id the number serves. OPENWA_WEBHOOK_URL lets core tell the gateway where to POST.
      OpenWa__InboundEnabled: ${OPENWA_INBOUND:-false}
      OpenWa__WebhookSecret: ${OPENWA_WEBHOOK_SECRET:-}
      OpenWa__OrganizationId: ${OPENWA_ORG_ID:-}
      OpenWa__WebhookUrl: ${OPENWA_WEBHOOK_URL:-}
      OpenWa__DisplayNumber: ${OPENWA_DISPLAY_NUMBER:-}
      # Answer only numbers that belong to a registered resident: any other number's message is stored and ignored with
      # no reply (no menu, status or complaint). Default true here so the line is not an open bot; set WA_RESIDENTS_ONLY=false
      # in .env to re-open it to guests/unknown senders per the organization's unknown-sender policy.
      WhatsApp__RegisteredResidentsOnly: ${WA_RESIDENTS_ONLY:-true}
      # Demo fixed OTP (123456) by default; set OTP_FIXED_CODE= (empty) in .env to send real random codes.
      # The "-" form (not ":-") means an explicit empty value disables the fixed code; unset keeps 123456.
      Otp__FixedCode: ${OTP_FIXED_CODE-123456}
    volumes: [keys:/keys]

  web:
    # nginx serving the built portal; proxies /api (REST + SignalR) to core, so there is no CORS to configure.
    build: ../../web
    restart: unless-stopped
    depends_on: [core]
    environment:
      PORT: "10000"
      CORE_HOSTPORT: core:8080

  caddy:
    # Terminates HTTPS for PUBLIC_HOST using the DigiCert wildcard certificate for *.vitonta.com
    # (mounted read-only from CERTS_DIR). ACME is not used here because the provider firewall blocks
    # inbound 443 from Let's Encrypt's validators. Port 80 is intentionally NOT published (a host nginx
    # owns it on this shared server).
    image: caddy:2
    restart: unless-stopped
    depends_on: [web, minio]
    # Both the portal and the media host share 443; Caddy routes them by hostname (SNI). No custom port is published.
    ports: ["443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CERTS_DIR:-/home/shafiq/certs}:/certs:ro
      - caddydata:/data

volumes:
  pgdata:
  miniodata:
  keys:
  caddydata:
  openwadata:
