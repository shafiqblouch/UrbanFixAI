# Render Blueprint for the two backend services only: the AI service (FastAPI) and the core API (.NET).
# The database and file storage are Supabase (see docs/deploy-render.md), so there is no Render Postgres here.
# Every `sync: false` value is asked for in the dashboard so secrets never live in the repo.
services:
  - type: web
    name: urbanfix-ai
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: urbanfix-core
    runtime: docker
    dockerfilePath: ./core/Dockerfile
    dockerContext: ./core
    plan: free
    healthCheckPath: /health/live
    envVars:
      # Development turns on the demo sign-in (phone code 123456). The API refuses fixed codes in any other environment.
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: DATABASE_URL
        sync: false
      - key: Database__AppRolePassword
        generateValue: true
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Bootstrap__PlatformAdminEmail
        value: admin@urbanfix.local
      - key: Bootstrap__PlatformAdminPassword
        generateValue: true
      # Public URL of urbanfix-ai, e.g. https://urbanfix-ai.onrender.com
      - key: Ai__BaseUrl
        sync: false
      - key: Ai__ServiceToken
        fromService:
          type: web
          name: urbanfix-ai
          envVarKey: AI_SERVICE_TOKEN
      - key: Storage__ServiceUrl
        sync: false
      - key: Storage__Region
        sync: false
      - key: Storage__AccessKey
        sync: false
      - key: Storage__SecretKey
        sync: false
      - key: Storage__Bucket
        value: urbanfix-media
